spring:
  application:
    name: new-jobs
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/job_discovery}
    username: ${DB_USERNAME:job_discovery}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include: health

hiringcafe:
  mcp-url: ${HIRINGCAFE_MCP_URL:https://hiringcafe.com/api/chatgpt/mcp}
  connect-timeout: ${HIRINGCAFE_CONNECT_TIMEOUT:3s}
  request-timeout: ${HIRINGCAFE_REQUEST_TIMEOUT:10s}
  retry-backoff: ${HIRINGCAFE_RETRY_BACKOFF:200ms}
  max-retry-delay: ${HIRINGCAFE_MAX_RETRY_DELAY:2s}
  max-attempts: ${HIRINGCAFE_MAX_ATTEMPTS:3}
  result-limit: ${HIRINGCAFE_RESULT_LIMIT:25}
