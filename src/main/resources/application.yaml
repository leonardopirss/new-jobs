spring:
  application:
    name: new-jobs
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/job_discovery}
    username: ${DB_USERNAME:job_discovery}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include: health
